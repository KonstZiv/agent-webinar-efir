# .github/workflows/ci.yml — quality gates on every push and pull request.
# Based on docs/gates/ci.yml; added: a pinned runner image, a PostgreSQL service container
# for tests, current action versions (Node 24), `uv sync --locked` and a read-only token.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_DB: app
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Встановити залежності
        run: uv sync --dev --locked
      - name: Лінтер
        run: uv run ruff check .
      - name: Типи
        run: uv run mypy src
      - name: Тести
        env:
          TEST_DATABASE_URL: postgresql://app@localhost:5432/app
        run: uv run pytest
