# .github/workflows/claude-code-review.yml — the review bot: comments on every pull request.
# Based on anthropics/claude-code-action examples/pr-review-comprehensive.yml and docs/solutions.md
# (v1); added: a pinned runner image, actions/checkout@v7 as in ci.yml, subscription auth, the
# project's review rules in the prompt, a timeout and one run per pull request at a time.
# The bot only reads and comments: --allowedTools grants the comment tools and read-only gh commands.
# Skipped: drafts, fork PRs (GitHub withholds secrets from them) and events sent by bots.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Рев'ю PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Ти — рев'ю-бот цього репозиторію. Гілка PR уже в робочій теці. Код не змінюй і комітів не роби.

            1. Прочитай правила: CLAUDE.md (зокрема розділи «Code Review Rules», «Межі коду», «Тексти», «Секрети і дані») і чек-лист docs/templates/review-checklist.md.
            2. Прочитай опис і наявні коментарі PR (gh pr view --comments) і диф (gh pr diff). Рецензуй лише диф.
            3. Коментуй лише суттєве: логіка і поведінка, дані, безпека, порушення домовленостей CLAUDE.md і пунктів чек-листа. Стиль, форматування й іменування не коментуй — це перевіряють гейти (ruff, mypy, pytest).
            4. Кожну знахідку — інлайн-коментарем до рядка (mcp__github_inline_comment__create_inline_comment, confirmed: true) у форматі чек-листа: що не так — чому це проблема. На початку — рівень за CLAUDE.md: «Блокер» або «Знахідка».
            5. Наприкінці — один підсумковий коментар через gh pr comment: знахідки списком, по рядку на кожну. Якщо суттєвого немає — один рядок: «Суттєвих зауважень немає.»
            6. Знахідку, яка вже є в коментарях PR, не повторюй.
            7. Пиши українською.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
