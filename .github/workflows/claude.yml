# .github/workflows/claude.yml — the cloud agent: responds to @claude in issues, PRs and comments.
# Based on anthropics/claude-code-action examples/claude.yml (v1); added: a pinned runner image,
# actions/checkout@v7 as in ci.yml, subscription auth, uv and a PostgreSQL service so the agent
# runs the repository gates, a plan-first instruction, a timeout and one run per issue at a time.
# Only people with write access can start the agent: the action checks the actor's permission
# and rejects bots (allowed_bots, allowed_non_write_users and github_token are deliberately unset).
# Subprocess isolation: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1" in the job env strips credentials,
# the OAuth token included, from the agent's Bash commands, hooks and MCP servers, and runs Bash
# commands in a bubblewrap sandbox with their own PID namespace. GitHub tokens stay visible by
# design, hence the narrow job permissions. On Linux the scrub needs bubblewrap, or Claude Code
# exits at startup; the action installs it only with allowed_non_write_users, so a step before
# the action repeats that setup (bubblewrap, socat, user namespaces allowed for Ubuntu 24.04's
# AppArmor) and checks bwrap, failing the job rather than running the agent without isolation.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # OIDC exchange for the Claude GitHub App token
    env:
      # Strips credentials from the agent's subprocesses and sandboxes its Bash commands
      # (Claude Code docs: env-vars; claude-code-action docs/security.md).
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_DB: app
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Ізоляція підпроцесів агента
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bwrap needs them.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Fail here rather than start the agent without isolation.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
      - name: Агент Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {"env": {"TEST_DATABASE_URL": "postgresql://app@localhost:5432/app"}}
          claude_args: |
            --allowedTools "Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run ruff check:*),Bash(uv run mypy:*)"
            --append-system-prompt "Правила репозиторію — CLAUDE.md; дотримуйся їх. Виклик @claude людиною з правом запису — погоджена задача: план не чекає окремого погодження, якщо Issue прямо не просить чекати.
            1. Перш ніж змінювати файли, онови свій коментар планом: короткі нумеровані кроки-чекбокси — що робиться і в яких файлах; тести — окремим кроком перед кодом; останній крок — прогін гейтів. Далі виконуй план і познач кроки в міру виконання.
            2. Гейти: uv run pytest, uv run ruff check ., uv run mypy src. Роботу завершуй лише на зелених.
            3. Розбіжність між задачею, CLAUDE.md і реальністю — зупинись і опиши її в коментарі; постановку сам не виправляй.
            4. Наприкінці — підсумок у тому самому коментарі (замість файла в .handoff/): що змінено, коміти, результат гейтів, розбіжності, відкриті запитання.
            Пиши коментарі українською."
