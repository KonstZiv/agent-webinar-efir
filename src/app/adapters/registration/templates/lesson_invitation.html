<p style="margin:0 0 16px;">Дякую, що зареєструвалися на відкритий вебінар «Архітектор замість кодера: як працює агентна розробка на Python». Запрошую вас на перше заняття курсу «Агентна розробка на Python» — воно відкрите для всіх, хто зареєструвався на вебінар.</p>

<p style="margin:0 0 24px;">До зустрічі 28 жовтня,<br>
Костянтин Зівенко</p>
