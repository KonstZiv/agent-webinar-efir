<section class="cookie-banner" role="dialog" aria-modal="false" aria-labelledby="cookie-banner-title" hidden>
  <h2 id="cookie-banner-title">{{ legal.banner.title }}</h2>
  <p>{{ legal.banner.text_html }}</p>
  <div class="cookie-banner__actions">
    <button type="button" class="cookie-banner__button" data-consent="granted">{{ legal.banner.allow }}</button>
    <button type="button" class="cookie-banner__button" data-consent="denied">{{ legal.banner.reject }}</button>
  </div>
</section>
