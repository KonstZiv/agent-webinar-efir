[project]
name = "app"
version = "0.1.0"
description = "FastAPI project template: settings, health check, legal pages, cookie banner, redirect mode"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
# Версію ruff фіксує uv у залежностях; набір правил за замовчуванням
# змінюється між версіями — тому вибір фіксується явно.
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]  # базовий розумний набір курсу

[tool.ruff.lint.per-file-ignores]
# Ревізії Alembic генеруються з одного шаблону з імпортами `sa` і `op`;
# злиття і ревізія з `pass` їх не використовують.
"src/app/adapters/db/migrations/versions/*" = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = false            # старт курсу; суворість підвищується поступово
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 75           # поріг pro-рівня; санітарний мінімум, не самоціль
